# PostgreSQL para desarrollo local:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: renty
      POSTGRES_PASSWORD: renty
      POSTGRES_DB: renty
    ports:
      - "5432:5432"
    volumes:
      - renty-db:/var/lib/postgresql/data
      # Crea también la base de pruebas (renty_test) la primera vez
      - ./backend/scripts/crear-bd-pruebas.sql:/docker-entrypoint-initdb.d/crear-bd-pruebas.sql:ro
volumes:
  renty-db:
