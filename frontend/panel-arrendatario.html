<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi panel — Renty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="panel" data-roles="arrendatario">
  <div id="nav"></div>
  <div id="subnav"></div>

  <main class="container">
    <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <p class="eyebrow mb-1">Arrendatario</p>
        <h1 class="h2 mb-0">Hola, <span data-user-name></span></h1>
      </div>
      <a class="btn btn-primary" href="propiedades.html"><i class="bi bi-search me-1"></i>Buscar propiedades</a>
    </div>

    <!-- Secciones del panel: al elegir una solo cambia la vista de abajo -->
    <div class="pestanas" role="tablist" aria-label="Secciones de tu panel">
      <button type="button" role="tab" id="t-favoritos" aria-controls="v-favoritos" aria-selected="true" data-vista="favoritos">Favoritos <span class="cuenta" id="nFavs"></span></button>
      <button type="button" role="tab" id="t-busquedas" aria-controls="v-busquedas" aria-selected="false" tabindex="-1" data-vista="busquedas">Búsquedas guardadas <span class="cuenta" id="nBusq"></span></button>
      <button type="button" role="tab" id="t-visitas" aria-controls="v-visitas" aria-selected="false" tabindex="-1" data-vista="visitas">Visitas <span class="cuenta" id="nVis"></span></button>
      <button type="button" role="tab" id="t-mensajes" aria-controls="v-mensajes" aria-selected="false" tabindex="-1" data-vista="mensajes">Mensajes <span class="cuenta" id="nMsg"></span></button>
    </div>

    <section id="v-favoritos" role="tabpanel" aria-labelledby="t-favoritos">
      <div class="row g-4" id="favs"></div>
    </section>

    <section id="v-busquedas" role="tabpanel" aria-labelledby="t-busquedas" hidden>
      <div class="d-flex justify-content-between align-items-center mb-1">
        <p class="text-muted mb-0">Te mostramos cuántas propiedades nuevas aparecieron desde la última vez que abriste cada búsqueda.</p>
        <a class="small fw-semibold text-nowrap ms-3" href="propiedades.html">Nueva búsqueda</a>
      </div>
      <div id="busquedas"></div>
    </section>

    <section id="v-visitas" role="tabpanel" aria-labelledby="t-visitas" hidden>
      <div id="visitas"></div>
    </section>

    <section id="v-mensajes" role="tabpanel" aria-labelledby="t-mensajes" hidden>
      <div class="d-flex justify-content-between align-items-center mb-1">
        <p class="text-muted mb-0">Tus conversaciones con propietarios e inmobiliarias.</p>
        <a class="small fw-semibold text-nowrap ms-3" href="mensajes.html">Abrir mensajes</a>
      </div>
      <div id="conversaciones"></div>
    </section>

    <section class="bloque mt-5">
      <h2 class="h4 mb-3">Recomendadas para ti</h2>
      <div class="row g-4" id="recs"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    Renty.ready.then(async () => {
      const $ = (id) => document.getElementById(id);
      const esc = Renty.esc;
      const vacio = (txt, icon = "bi-inbox") => `<div class="text-center text-muted py-5"><i class="bi ${icon} fs-3 d-block mb-2 text-terracota"></i>${txt}</div>`;
      const ESTADOS = { pendiente: ["revision", "Pendiente"], confirmada: ["activa", "Confirmada"], reprogramar: ["nuevo", "Proponen otra fecha"], cancelada: ["pausada", "Cancelada"] };

      /* ---------- Pestañas: cada sección se carga la primera vez que se abre ---------- */
      const cargadas = new Set();
      const CARGAR = { favoritos: cargarFavoritos, busquedas: cargarBusquedas, visitas: cargarVisitas, mensajes: cargarMensajes };

      /* ---------- Números de cada pestaña ---------- */
      async function resumen() {
        try {
          const r = await Renty.api("/panel/resumen");
          $("nFavs").textContent = r.favoritos; $("nBusq").textContent = r.busquedas;
          $("nVis").textContent = r.visitas_proximas; $("nMsg").textContent = r.no_leidos || "";
          $("t-mensajes").setAttribute("aria-label", r.no_leidos ? `Mensajes, ${Renty.plural(r.no_leidos, "sin leer", "sin leer")}` : "Mensajes");
        } catch { /* las pestañas funcionan aunque falten los números */ }
      }

      /* ---------- Favoritos ---------- */
      async function cargarFavoritos() {
        $("favs").innerHTML = Renty.cargando();
        try {
          const favs = await Renty.api("/favoritos");
          $("favs").innerHTML = favs.length ? Renty.grid(favs)
            : `<div class="col-12">${vacio('Aún no tienes favoritos. Toca el corazón en cualquier propiedad para guardarla.<br><a href="propiedades.html">Buscar propiedades</a>', "bi-heart")}</div>`;
        } catch (err) { $("favs").innerHTML = Renty.falla(err); }
      }

      /* ---------- Búsquedas guardadas ---------- */
      async function cargarBusquedas() {
        try {
          const lista = await Renty.api("/busquedas");
          $("busquedas").innerHTML = lista.length ? lista.map((b) => `
            <div class="list-row">
              <span class="icon-bubble"><i class="bi bi-bell"></i></span>
              <div class="flex-grow-1" style="min-width:0"><div class="fw-semibold text-truncate">${esc(b.nombre)}</div><small class="text-muted">${Renty.plural(b.total, "propiedad disponible", "propiedades disponibles")}</small></div>
              ${b.nuevas ? `<span class="estado nuevo">${Renty.plural(b.nuevas, "nueva", "nuevas")}</span>` : ""}
              <a class="btn btn-light btn-sm" href="propiedades.html?${esc(b.filtros)}" data-ver="${b.id}">Ver</a>
              <button class="btn btn-light btn-sm" data-borrar="${b.id}" aria-label="Eliminar búsqueda ${esc(b.nombre)}"><i class="bi bi-trash"></i></button>
            </div>`).join("")
            : vacio('Guarda una búsqueda desde el listado y te avisaremos de las propiedades nuevas.<br><a href="propiedades.html">Ir a buscar</a>', "bi-bell");
        } catch (err) { $("busquedas").innerHTML = vacio(esc(err.message), "bi-wifi-off"); }
      }
      $("busquedas").addEventListener("click", async (e) => {
        const ver = e.target.closest("[data-ver]");
        if (ver) { e.preventDefault(); Renty.api(`/busquedas/${ver.dataset.ver}/revisada`, { method: "POST" }).finally(() => location.href = ver.href); }
        const borrar = e.target.closest("[data-borrar]");
        if (borrar && confirm("¿Eliminar esta búsqueda guardada?")) {
          try { await Renty.api("/busquedas/" + borrar.dataset.borrar, { method: "DELETE" }); cargarBusquedas(); resumen(); }
          catch (err) { Renty.aviso(err.message, "error"); }
        }
      });

      /* ---------- Visitas ---------- */
      const filaVisita = (v, pasada) => {
        const [clase, txt] = ESTADOS[v.estado];
        return `
        <div class="list-row ${pasada ? "opacity-75" : ""}">
          <div class="text-center bg-terracota-suave rounded-3 px-3 py-2" style="min-width:62px"><div class="small text-terracota fw-bold text-uppercase">${esc(Renty.fecha(v.fecha, { month: "short" }).replace(".", ""))}</div><div class="fs-5 fw-bold lh-1">${Number(v.fecha.slice(8))}</div></div>
          <div class="flex-grow-1" style="min-width:0"><a class="fw-semibold text-body text-decoration-none d-block text-truncate" href="propiedad.html?id=${v.propiedad.id}">${esc(v.propiedad.titulo)}</a>
            <small class="text-muted">${esc(Renty.fecha(v.fecha, { weekday: "long" }))}${v.hora ? " · " + Renty.hora(v.hora) : ""} · ${esc(v.propiedad.zona)} · con ${esc(v.publicador.nombre)}</small>
            <div><span class="estado ${clase}">${txt}</span></div></div>
          ${pasada ? "" : `<div class="dropdown"><button class="btn btn-light btn-sm" data-bs-toggle="dropdown" aria-label="Opciones de la visita"><i class="bi bi-three-dots"></i></button>
            <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="mensajes.html">Escribir a ${esc(v.publicador.nombre)}</a></li><li><button class="dropdown-item text-danger" data-cancelar="${v.id}">Cancelar visita</button></li></ul></div>`}
        </div>`;
      };
      async function cargarVisitas() {
        try {
          const hoy = new Date().toISOString().slice(0, 10);
          const todas = await Renty.api("/visitas");
          const proximas = todas.filter((v) => v.fecha >= hoy && v.estado !== "cancelada");
          const anteriores = todas.filter((v) => !proximas.includes(v));
          $("visitas").innerHTML = (proximas.length ? proximas.map((v) => filaVisita(v, false)).join("")
              : vacio("No tienes visitas próximas. Solicítalas desde la página de cada propiedad.", "bi-calendar3"))
            + (anteriores.length ? `<h2 class="h6 text-muted text-uppercase mt-4 mb-0" style="letter-spacing:.06em">Anteriores y canceladas</h2>${anteriores.map((v) => filaVisita(v, true)).join("")}` : "");
        } catch (err) { $("visitas").innerHTML = vacio(esc(err.message), "bi-wifi-off"); }
      }
      $("visitas").addEventListener("click", async (e) => {
        const b = e.target.closest("[data-cancelar]");
        if (!b || !confirm("¿Cancelar esta visita?")) return;
        try { await Renty.api("/visitas/" + b.dataset.cancelar, { method: "PATCH", body: { estado: "cancelada" } }); Renty.aviso("Visita cancelada"); cargarVisitas(); resumen(); }
        catch (err) { Renty.aviso(err.message, "error"); }
      });

      /* ---------- Mensajes ---------- */
      async function cargarMensajes() {
        try {
          const lista = await Renty.api("/conversaciones");
          $("conversaciones").innerHTML = lista.length ? lista.map((c) => `
            <a class="list-row text-decoration-none text-body" href="mensajes.html?c=${c.id}">
              <span class="avatar">${esc(Renty.initials(c.con.nombre))}</span>
              <div class="flex-grow-1" style="min-width:0">
                <div class="d-flex justify-content-between gap-2"><span class="fw-semibold text-truncate">${esc(c.con.nombre)}</span><small class="text-muted text-nowrap">${c.ultimo ? Renty.hace(c.ultimo.creado) : ""}</small></div>
                <small class="text-terracota d-block text-truncate">${esc(c.propiedad.titulo)}</small>
                <small class="d-block text-truncate ${c.no_leidos ? "fw-semibold" : "text-muted"}">${c.ultimo ? (c.ultimo.mio ? "Tú: " : "") + esc(c.ultimo.texto) : ""}</small>
              </div>
              ${c.no_leidos ? `<span class="estado nuevo">${Renty.plural(c.no_leidos, "sin leer", "sin leer")}</span>` : ""}
            </a>`).join("")
            : vacio('Aún no tienes conversaciones. Escribe desde la página de una propiedad que te interese.', "bi-chat-dots");
        } catch (err) { $("conversaciones").innerHTML = vacio(esc(err.message), "bi-wifi-off"); }
      }

      /* ---------- Recomendadas ---------- */
      async function recomendadas() {
        $("recs").innerHTML = Renty.cargando();
        try {
          const r = await Renty.api("/propiedades?operacion=renta&limite=9");
          $("recs").innerHTML = Renty.grid(r.propiedades.filter((p) => !p.es_favorito).slice(0, 3));
        } catch (err) { $("recs").innerHTML = Renty.falla(err); }
      }

      // Al guardar o quitar un favorito (aquí o en las recomendadas), se actualizan la lista y el número
      document.addEventListener("renty:favs", () => { cargarFavoritos(); resumen(); });

      resumen(); recomendadas();
      Renty.pestanas(document.querySelector(".pestanas"), {
        alMostrar: (vista) => { if (!cargadas.has(vista)) { cargadas.add(vista); CARGAR[vista](); } }
      });
    });
  </script>
</body>
</html>
