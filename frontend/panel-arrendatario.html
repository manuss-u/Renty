<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi panel — Renty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="panel" data-roles="arrendatario">
  <div id="nav"></div>
  <div id="subnav"></div>

  <main class="container">
    <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <p class="eyebrow mb-1">Arrendatario</p>
        <h1 class="h2 mb-0">Hola, <span data-user-name></span></h1>
      </div>
      <a class="btn btn-primary" href="propiedades.html"><i class="bi bi-search me-1"></i>Buscar propiedades</a>
    </div>

    <div class="stats mb-5">
      <a class="stat" href="favoritos.html"><div class="num" id="nFavs">–</div><div class="lbl">Favoritos guardados</div></a>
      <div class="stat"><div class="num" id="nBusq">–</div><div class="lbl">Búsquedas guardadas</div></div>
      <div class="stat"><div class="num" id="nVis">–</div><div class="lbl">Visitas próximas</div></div>
      <a class="stat" href="mensajes.html"><div class="num" id="nMsg">–</div><div class="lbl" id="lMsg">Mensajes sin leer</div></a>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="bloque h-100">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0">Búsquedas guardadas</h2>
            <a class="small fw-semibold" href="propiedades.html">Nueva búsqueda</a>
          </div>
          <div id="busquedas"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="bloque h-100">
          <h2 class="h5 mb-2">Próximas visitas</h2>
          <div id="visitas"></div>
        </div>
      </div>
    </div>

    <section class="mt-5">
      <div class="d-flex justify-content-between align-items-end mb-3">
        <h2 class="h4 mb-0">Tus favoritos</h2>
        <a class="fw-semibold" href="favoritos.html">Ver todos</a>
      </div>
      <div class="row g-4" id="favs"></div>
    </section>

    <section class="mt-5">
      <h2 class="h4 mb-3">Recomendadas para ti</h2>
      <div class="row g-4" id="recs"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    Renty.ready.then(async () => {
      const $ = (id) => document.getElementById(id);
      const esc = Renty.esc;
      const vacio = (txt, icon = "bi-inbox") => `<div class="text-center text-muted py-4"><i class="bi ${icon} fs-4 d-block mb-2 text-terracota"></i>${txt}</div>`;
      const ESTADOS = { pendiente: ["revision", "Pendiente"], confirmada: ["activa", "Confirmada"], reprogramar: ["nuevo", "Reprogramar"], cancelada: ["pausada", "Cancelada"] };

      async function resumen() {
        try {
          const r = await Renty.api("/panel/resumen");
          $("nFavs").textContent = r.favoritos; $("nBusq").textContent = r.busquedas;
          $("nVis").textContent = r.visitas_proximas; $("nMsg").textContent = r.no_leidos;
          $("lMsg").textContent = r.no_leidos === 1 ? "Mensaje sin leer" : "Mensajes sin leer";
        } catch { /* las cifras quedan en – */ }
      }

      async function busquedas() {
        try {
          const lista = await Renty.api("/busquedas");
          $("busquedas").innerHTML = lista.length ? lista.map((b) => `
            <div class="list-row">
              <span class="icon-bubble"><i class="bi bi-bell"></i></span>
              <div class="flex-grow-1" style="min-width:0"><div class="fw-semibold text-truncate">${esc(b.nombre)}</div><small class="text-muted">${Renty.plural(b.total, "propiedad disponible", "propiedades disponibles")}</small></div>
              ${b.nuevas ? `<span class="estado nuevo">${Renty.plural(b.nuevas, "nueva", "nuevas")}</span>` : ""}
              <a class="btn btn-light btn-sm" href="propiedades.html?${esc(b.filtros)}" data-ver="${b.id}">Ver</a>
              <button class="btn btn-light btn-sm" data-borrar="${b.id}" aria-label="Eliminar búsqueda ${esc(b.nombre)}"><i class="bi bi-trash"></i></button>
            </div>`).join("")
            : vacio('Guarda una búsqueda desde el listado y te avisaremos de las propiedades nuevas.', "bi-bell");
        } catch (err) { $("busquedas").innerHTML = vacio(esc(err.message), "bi-wifi-off"); }
      }
      $("busquedas").addEventListener("click", async (e) => {
        const ver = e.target.closest("[data-ver]");
        if (ver) { e.preventDefault(); Renty.api(`/busquedas/${ver.dataset.ver}/revisada`, { method: "POST" }).finally(() => location.href = ver.href); }
        const borrar = e.target.closest("[data-borrar]");
        if (borrar && confirm("¿Eliminar esta búsqueda guardada?")) {
          try { await Renty.api("/busquedas/" + borrar.dataset.borrar, { method: "DELETE" }); busquedas(); resumen(); }
          catch (err) { Renty.aviso(err.message, "error"); }
        }
      });

      async function visitas() {
        try {
          const hoy = new Date().toISOString().slice(0, 10);
          const lista = (await Renty.api("/visitas")).filter((v) => v.fecha >= hoy && v.estado !== "cancelada");
          $("visitas").innerHTML = lista.length ? lista.map((v) => {
            const [clase, txt] = ESTADOS[v.estado];
            return `
            <div class="list-row">
              <div class="text-center bg-terracota-suave rounded-3 px-3 py-2"><div class="small text-terracota fw-bold text-uppercase">${esc(Renty.fecha(v.fecha, { month: "short" }).replace(".", ""))}</div><div class="fs-5 fw-bold lh-1">${Number(v.fecha.slice(8))}</div></div>
              <div class="flex-grow-1" style="min-width:0"><a class="fw-semibold text-body text-decoration-none d-block text-truncate" href="propiedad.html?id=${v.propiedad.id}">${esc(v.propiedad.titulo)}</a><small class="text-muted">${Renty.hora(v.hora)} · ${esc(v.propiedad.zona)}</small></div>
              <span class="estado ${clase}">${txt}</span>
              <div class="dropdown"><button class="btn btn-light btn-sm" data-bs-toggle="dropdown" aria-label="Opciones de la visita"><i class="bi bi-three-dots"></i></button>
                <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="mensajes.html">Escribir a ${esc(v.publicador.nombre)}</a></li><li><button class="dropdown-item text-danger" data-cancelar="${v.id}">Cancelar visita</button></li></ul></div>
            </div>`;
          }).join("") : vacio('No tienes visitas agendadas. Solicítalas desde la página de cada propiedad.', "bi-calendar3");
        } catch (err) { $("visitas").innerHTML = vacio(esc(err.message), "bi-wifi-off"); }
      }
      $("visitas").addEventListener("click", async (e) => {
        const b = e.target.closest("[data-cancelar]");
        if (!b || !confirm("¿Cancelar esta visita?")) return;
        try { await Renty.api("/visitas/" + b.dataset.cancelar, { method: "PATCH", body: { estado: "cancelada" } }); Renty.aviso("Visita cancelada"); visitas(); resumen(); }
        catch (err) { Renty.aviso(err.message, "error"); }
      });

      async function propiedades() {
        $("favs").innerHTML = $("recs").innerHTML = Renty.cargando();
        try {
          const [favs, recs] = await Promise.all([Renty.api("/favoritos"), Renty.api("/propiedades?operacion=renta&limite=9")]);
          $("favs").innerHTML = favs.length ? Renty.grid(favs.slice(0, 3))
            : `<div class="col-12"><div class="empty-state"><i class="bi bi-heart"></i><p class="mt-2 mb-0 text-muted">Aún no tienes favoritos. Toca el corazón en cualquier propiedad para guardarla.</p></div></div>`;
          $("recs").innerHTML = Renty.grid(recs.propiedades.filter((p) => !p.es_favorito).slice(0, 3));
        } catch (err) { $("favs").innerHTML = Renty.falla(err); $("recs").innerHTML = ""; }
      }
      document.addEventListener("renty:favs", () => { propiedades(); resumen(); });

      resumen(); busquedas(); visitas(); propiedades();
    });
  </script>
</body>
</html>
