<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta — Renty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="registro">
  <div id="nav"></div>

  <main class="container py-4 py-lg-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <h1 class="h2 mb-1">Crea tu cuenta</h1>
        <p class="text-muted">¿Ya tienes una? <a href="login.html">Ingresa</a></p>

        <form id="reg" class="card p-4 mt-3" novalidate>
          <fieldset class="mb-4">
            <legend class="form-label">¿Cómo vas a usar Renty?</legend>
            <div class="row g-2 role-option">
              <div class="col-md-4">
                <input class="btn-check" type="radio" name="rol" id="rA" value="arrendatario" checked>
                <label for="rA"><i class="bi bi-search-heart"></i><b>Busco propiedad</b><small>Quiero rentar o comprar</small></label>
              </div>
              <div class="col-md-4">
                <input class="btn-check" type="radio" name="rol" id="rP" value="propietario">
                <label for="rP"><i class="bi bi-key"></i><b>Soy propietario</b><small>Publico mis propiedades</small></label>
              </div>
              <div class="col-md-4">
                <input class="btn-check" type="radio" name="rol" id="rI" value="inmobiliaria">
                <label for="rI"><i class="bi bi-buildings"></i><b>Soy inmobiliaria</b><small>Gestiono un portafolio</small></label>
              </div>
            </div>
          </fieldset>

          <div class="row g-3">
            <div class="col-md-6" data-solo="inmobiliaria" hidden>
              <label class="form-label" for="empresa">Nombre de la inmobiliaria</label>
              <input class="form-control" id="empresa" autocomplete="organization">
              <div class="invalid-feedback">Escribe el nombre de la inmobiliaria.</div>
            </div>
            <div class="col-md-6" data-solo="inmobiliaria" hidden>
              <label class="form-label" for="nit">NIT</label>
              <input class="form-control" id="nit" inputmode="numeric" placeholder="900123456-7">
              <div class="invalid-feedback">Escribe el NIT.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="nombre" id="nombreLbl">Nombre completo</label>
              <input class="form-control" id="nombre" autocomplete="name" required>
              <div class="invalid-feedback">Escribe tu nombre.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="tel">Teléfono</label>
              <input class="form-control" id="tel" type="tel" autocomplete="tel" required pattern="[0-9 +\(\)\-]{7,}">
              <div class="invalid-feedback">Escribe un teléfono de contacto.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Correo electrónico</label>
              <input class="form-control" id="email" type="email" autocomplete="email" required>
              <div class="invalid-feedback">Escribe un correo válido.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="pass">Contraseña</label>
              <input class="form-control" id="pass" type="password" autocomplete="new-password" required minlength="8" aria-describedby="passHelp">
              <div class="form-text" id="passHelp">Mínimo 8 caracteres.</div>
              <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="tyc" required>
                <label class="form-check-label" for="tyc">Acepto los <a href="#">términos y condiciones</a> y la <a href="#">política de privacidad</a>.</label>
                <div class="invalid-feedback">Debes aceptar para continuar.</div>
              </div>
            </div>
          </div>

          <button class="btn btn-primary btn-lg mt-4" type="submit">Crear cuenta</button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    Renty.ready.then((yaConSesion) => {
      if (yaConSesion) { location.replace(Renty.ROLES[yaConSesion.rol].panel); return; }
      const form = document.getElementById("reg");
      const pre = new URLSearchParams(location.search).get("rol");
      if (pre && Renty.ROLES[pre]) form.querySelector(`[name="rol"][value="${pre}"]`).checked = true;

      function ajustar() {
        const inmo = form.rol.value === "inmobiliaria";
        form.querySelectorAll('[data-solo="inmobiliaria"]').forEach((c) => { c.hidden = !inmo; c.querySelector("input").required = inmo; });
        document.getElementById("nombreLbl").textContent = inmo ? "Nombre del responsable" : "Nombre completo";
      }
      form.addEventListener("change", ajustar);
      ajustar();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        form.classList.add("was-validated");
        if (!form.checkValidity()) return;
        const datos = {
          rol: form.rol.value, email: form.email.value, password: form.pass.value,
          nombre: form.nombre.value, telefono: form.tel.value, empresa: form.empresa.value, nit: form.nit.value
        };
        try {
          const u = await Renty.ocupado(e.submitter, () => Renty.register(datos));
          location.href = Renty.ROLES[u.rol].panel;
        } catch (err) { Renty.erroresEnForm(form, err, { password: "pass", telefono: "tel" }); }
      });
    });
  </script>
</body>
</html>
