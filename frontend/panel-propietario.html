<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis propiedades — Renty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="panel" data-roles="propietario">
  <div id="nav"></div>
  <div id="subnav"></div>

  <main class="container">
    <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <p class="eyebrow mb-1">Propietario</p>
        <h1 class="h2 mb-0">Hola, <span data-user-name></span></h1>
      </div>
      <a class="btn btn-primary" href="publicar.html"><i class="bi bi-plus-lg me-1"></i>Publicar propiedad</a>
    </div>

    <div class="stats mb-5">
      <div class="stat"><div class="num" data-stat="activas">–</div><div class="lbl">Propiedades publicadas</div></div>
      <div class="stat"><div class="num" data-stat="vistas">–</div><div class="lbl">Vistas en total</div></div>
      <div class="stat"><div class="num" data-stat="contactos">–</div><div class="lbl">Personas interesadas</div></div>
      <div class="stat"><div class="num" data-stat="visitas_pendientes">–</div><div class="lbl">Visitas por confirmar</div></div>
    </div>

    <div class="row g-4">
      <div class="col-xl-8">
        <div class="bloque">
          <h2 class="h5 mb-2">Mis propiedades</h2>
          <div class="table-responsive">
            <table class="table">
              <thead><tr><th>Propiedad</th><th>Precio</th><th>Estado</th><th class="text-end">Vistas</th><th class="text-end">Contactos</th><th><span class="visually-hidden">Acciones</span></th></tr></thead>
              <tbody id="filas"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-xl-4">
        <div class="bloque mb-4">
          <h2 class="h5 mb-2">Solicitudes de visita</h2>
          <div id="solicitudes"></div>
        </div>
        <div class="bloque">
          <h2 class="h5 mb-2">Interesados recientes</h2>
          <div id="leads"></div>
          <a class="btn btn-light w-100 mt-3" href="mensajes.html">Ir a mensajes</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/panel-publicador.js"></script>
</body>
</html>
